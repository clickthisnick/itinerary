<!doctype html>
<html lang="en-US">
  <head>
    <!-- Needed for mobile to function (somewhat) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      href="assets/ceruleanBootswatch.min.css"
    />
    <script type="module" src="itinerary.js"></script>
  </head>
  <body onload="startTime()">
    <br />
    <table>
      <thead>
        <tr>
          <th class="col-xs-4" id="promptEvent">What is your event?</th>
          <th class="col-xs-4" id="promtTime">When is your event?</th>
          <th class="col-xs-2" id="promptAction">Action</th>
          <th class="col-xs-2" id="promptChangeAction">Change Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <input type="text" id="eventName" class="col-xs-6 form-control" />
          </td>
          <td>
            <input type="text" id="eventTime" class="col-xs-6 form-control" />
          </td>
          <td id="addAction">
            <!-- prettier-ignore -->
            <button id="addEventButton" class="btn btn-success" type="button" onclick="addRow()">Add Event</button>
          </td>
          <td id="changeAction">
            <!-- prettier-ignore -->
            <button id="changeActionButton" class="btn btn-success" type="button" onclick="changeAction()">remove</button>
          </td>
        </tr>
      </tbody>
    </table>
    <table id="timeTable" class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Time</th>
          <th>Description</th>
          <th>Action</th>
        </tr>
      </thead>
    </table>
    <br />
    <div class="col-xs-4">
      <h2>Current Time</h2>
    </div>
    <div class="col-xs-4">
      <h2 id="time"></h2>
    </div>
  </body>
</html>
